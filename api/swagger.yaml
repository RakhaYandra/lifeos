openapi: 3.0.3
info:
  title: lifeos API
  description: Personal Life OS — Go/Gin + SQLite + JWT, single-user lokal.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: lokal
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Creds:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: aku@lifeos.local }
        password: { type: string, example: Rahasia123 }
    Settings:
      type: object
      required: [active_year, currency]
      properties:
        active_year: { type: integer, example: 2026 }
        currency: { type: string, example: IDR }
        budget_warn_pct: { type: integer, example: 80 }
        goal_warn_pct: { type: integer, example: 70 }
    Error:
      type: object
      properties:
        error: { type: string }
    ProjectIn:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Renovasi kamar }
        life_area_id: { type: integer, example: 8 }
        status: { type: string, example: active }
        start_date: { type: string, format: date }
        target_date: { type: string, format: date }
        notes: { type: string }
    TaskIn:
      type: object
      required: [title]
      properties:
        title: { type: string, example: Cat dinding }
        project_id: { type: integer }
        status: { type: string, example: inbox }
        priority: { type: string, example: high }
        due_date: { type: string, format: date }
    GoalIn:
      type: object
      required: [title]
      properties:
        title: { type: string, example: Dana darurat 20jt }
        level: { type: string, example: annual }
        parent_id: { type: integer }
        metric: { type: string, example: IDR }
        target_value: { type: number, example: 20000000 }
        current_value: { type: number, example: 5000000 }
        status: { type: string, example: active }
        target_date: { type: string, format: date }
    HabitIn:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Olahraga }
        frequency: { type: string, example: daily }
        target_per_week: { type: integer, example: 3 }
    TrxIn:
      type: object
      required: [date, type, category, amount]
      properties:
        date: { type: string, format: date, example: "2026-09-01" }
        type: { type: string, example: expense }
        category: { type: string, example: Makan }
        description: { type: string, example: Warteg }
        amount: { type: number, example: 25000 }
        account: { type: string, example: Tunai }
    BudgetIn:
      type: object
      required: [year, month, category, amount]
      properties:
        year: { type: integer, example: 2026 }
        month: { type: integer, example: 9 }
        category: { type: string, example: Makan }
        amount: { type: number, example: 1500000 }
    SubIn:
      type: object
      required: [service, next_billing]
      properties:
        service: { type: string, example: Spotify }
        category: { type: string, example: Hiburan }
        cost: { type: number, example: 54999 }
        frequency: { type: string, example: monthly }
        next_billing: { type: string, format: date }
security: []
paths:
  /healthz:
    get:
      summary: Health check
      operationId: health
      responses:
        "200": { description: ok }
  /v1/auth/register:
    post:
      summary: Daftar akun pertama saja (single-user)
      operationId: register
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/Creds" } }
      responses:
        "201": { description: created }
        "403": { description: single_user_only }
        "409": { description: email_taken }
  /v1/auth/login:
    post:
      summary: Login, dapat JWT 24 jam
      operationId: login
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/Creds" } }
      responses:
        "200": { description: token }
        "401": { description: invalid_credentials }
  /v1/me:
    get:
      summary: Profil sendiri
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: profil }
        "401": { description: unauthorized }
  /v1/settings:
    get:
      summary: Ambil settings
      operationId: getSettings
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    put:
      summary: Update settings
      operationId: putSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/Settings" } }
      responses:
        "200": { description: ok }
  /v1/life-areas:
    get:
      summary: Daftar 8 life areas
      operationId: listLifeAreas
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: list }
  /v1/projects:
    get:
      summary: List projects + progress
      operationId: listProjects
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: list }
    post:
      summary: Buat project
      operationId: createProject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ProjectIn" } }
      responses:
        "201": { description: created }
  /v1/projects/{id}:
    get:
      summary: Detail project
      operationId: getProject
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: ok }
        "404": { description: not_found }
    put:
      summary: Update project
      operationId: updateProject
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ProjectIn" } }
      responses:
        "200": { description: ok }
    delete:
      summary: Hapus project
      operationId: deleteProject
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: deleted }
  /v1/tasks:
    get:
      summary: List tasks + overdue/days_remaining (?status=&project_id=)
      operationId: listTasks
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: list }
    post:
      summary: Buat task (default inbox)
      operationId: createTask
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/TaskIn" } }
      responses:
        "201": { description: created }
  /v1/tasks/today:
    get:
      summary: Tasks due hari ini (WIB)
      operationId: tasksToday
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: list }
  /v1/tasks/week:
    get:
      summary: Tasks seminggu (?start=YYYY-MM-DD, default hari ini)
      operationId: tasksWeek
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: ok }
  /v1/tasks/{id}:
    get:
      summary: Detail task
      operationId: getTask
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: ok }
        "404": { description: not_found }
    put:
      summary: Update task (completed auto-stamp)
      operationId: updateTask
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/TaskIn" } }
      responses:
        "200": { description: ok }
    delete:
      summary: Hapus task
      operationId: deleteTask
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: deleted }
  /v1/goals:
    get:
      summary: List goals (?level=annual|monthly, progress cap 0-100)
      operationId: listGoals
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: list }
    post:
      summary: Buat goal
      operationId: createGoal
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/GoalIn" } }
      responses:
        "201": { description: created }
  /v1/goals/{id}:
    get:
      summary: Detail goal
      operationId: getGoal
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: ok }
        "404": { description: not_found }
    put:
      summary: Update goal
      operationId: updateGoal
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/GoalIn" } }
      responses:
        "200": { description: ok }
    delete:
      summary: Hapus goal
      operationId: deleteGoal
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: deleted }
  /v1/habits:
    get:
      summary: List habits + streak
      operationId: listHabits
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: list }
    post:
      summary: Buat habit
      operationId: createHabit
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/HabitIn" } }
      responses:
        "201": { description: created }
  /v1/habits/streaks:
    get:
      summary: Streak semua habits
      operationId: habitStreaks
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: list }
  /v1/habits/{id}:
    get:
      summary: Detail habit
      operationId: getHabit
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: ok }
        "404": { description: not_found }
    put:
      summary: Update habit
      operationId: updateHabit
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/HabitIn" } }
      responses:
        "200": { description: ok }
    delete:
      summary: Hapus habit
      operationId: deleteHabit
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: deleted }
  /v1/habits/{id}/log:
    post:
      summary: Centang habit (default hari ini WIB)
      operationId: logHabit
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, format: date }
                done: { type: boolean }
      responses:
        "200": { description: ok }
  /v1/transactions:
    get:
      summary: List transaksi (?type=&category=&year=&month=)
      operationId: listTrx
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: list }
    post:
      summary: Catat transaksi
      operationId: createTrx
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/TrxIn" } }
      responses:
        "201": { description: created }
  /v1/transactions/summary:
    get:
      summary: Ringkasan bulan (?year=&month=)
      operationId: trxSummary
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: ok }
  /v1/transactions/{id}:
    get:
      summary: Detail transaksi
      operationId: getTrx
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: ok }
        "404": { description: not_found }
    put:
      summary: Update transaksi
      operationId: updateTrx
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/TrxIn" } }
      responses:
        "200": { description: ok }
    delete:
      summary: Hapus transaksi
      operationId: deleteTrx
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: deleted }
  /v1/budgets:
    get:
      summary: List budget + aktual otomatis (?year=&month=)
      operationId: listBudgets
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: list }
    post:
      summary: Buat budget
      operationId: createBudget
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/BudgetIn" } }
      responses:
        "201": { description: created }
  /v1/budgets/{id}:
    get:
      summary: Detail budget
      operationId: getBudget
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: ok }
        "404": { description: not_found }
    put:
      summary: Update budget
      operationId: updateBudget
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/BudgetIn" } }
      responses:
        "200": { description: ok }
    delete:
      summary: Hapus budget
      operationId: deleteBudget
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: deleted }
  /v1/subscriptions:
    get:
      summary: List langganan + annual_cost + days_until
      operationId: listSubs
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: list }
    post:
      summary: Tambah langganan
      operationId: createSub
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/SubIn" } }
      responses:
        "201": { description: created }
  /v1/subscriptions/upcoming:
    get:
      summary: Renewal dekat (?within_days=14)
      operationId: subsUpcoming
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: list }
  /v1/subscriptions/{id}:
    get:
      summary: Detail langganan
      operationId: getSub
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: ok }
        "404": { description: not_found }
    put:
      summary: Update langganan
      operationId: updateSub
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/SubIn" } }
      responses:
        "200": { description: ok }
    delete:
      summary: Hapus langganan
      operationId: deleteSub
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: deleted }
