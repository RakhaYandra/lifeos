openapi: 3.0.3
info:
  title: lifeos API
  description: Personal Life OS — Go/Gin + SQLite + JWT, single-user lokal.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: lokal
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Creds:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: aku@lifeos.local }
        password: { type: string, example: Rahasia123 }
    Settings:
      type: object
      required: [active_year, currency]
      properties:
        active_year: { type: integer, example: 2026 }
        currency: { type: string, example: IDR }
        budget_warn_pct: { type: integer, example: 80 }
        goal_warn_pct: { type: integer, example: 70 }
    Error:
      type: object
      properties:
        error: { type: string }
    ProjectIn:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Renovasi kamar }
        life_area_id: { type: integer, example: 8 }
        status: { type: string, example: active }
        start_date: { type: string, format: date }
        target_date: { type: string, format: date }
        notes: { type: string }
    TaskIn:
      type: object
      required: [title]
      properties:
        title: { type: string, example: Cat dinding }
        project_id: { type: integer }
        status: { type: string, example: inbox }
        priority: { type: string, example: high }
        due_date: { type: string, format: date }
    GoalIn:
      type: object
      required: [title]
      properties:
        title: { type: string, example: Dana darurat 20jt }
        level: { type: string, example: quarterly, enum: [annual, quarterly, monthly] }
        parent_id: { type: integer }
        metric: { type: string, example: IDR }
        target_value: { type: number, example: 20000000 }
        current_value: { type: number, example: 5000000 }
        status: { type: string, example: active }
        target_date: { type: string, format: date }
    HabitIn:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Olahraga }
        frequency: { type: string, example: daily }
        target_per_week: { type: integer, example: 3 }
    TrxIn:
      type: object
      required: [date, type, category, amount]
      properties:
        date: { type: string, format: date, example: "2026-09-01" }
        type: { type: string, example: expense }
        category: { type: string, example: Makan }
        description: { type: string, example: Warteg }
        amount: { type: number, example: 25000 }
        account: { type: string, example: Tunai }
    BudgetIn:
      type: object
      required: [year, month, category, amount]
      properties:
        year: { type: integer, example: 2026 }
        month: { type: integer, example: 9 }
        category: { type: string, example: Makan }
        amount: { type: number, example: 1500000 }
    SubIn:
      type: object
      required: [service, next_billing]
      properties:
        service: { type: string, example: Spotify }
        category: { type: string, example: Hiburan }
        cost: { type: number, example: 54999 }
        frequency: { type: string, example: monthly }
        next_billing: { type: string, format: date }
security: []
paths:
  /healthz:
    get:
      summary: Health check
      operationId: health
      responses:
        "200": { description: ok }
  /v1/auth/register:
    post:
      summary: Daftar akun pertama saja (single-user)
      operationId: register
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/Creds" } }
      responses:
        "201": { description: created }
        "403": { description: single_user_only }
        "409": { description: email_taken }
  /v1/auth/login:
    post:
      summary: Login, dapat JWT 24 jam
      operationId: login
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/Creds" } }
      responses:
        "200": { description: token }
        "401": { description: invalid_credentials }
  /v1/me:
    get:
      summary: Profil sendiri
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: profil }
        "401": { description: unauthorized }
  /v1/settings:
    get:
      summary: Ambil settings
      operationId: getSettings
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    put:
      summary: Update settings
      operationId: putSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/Settings" } }
